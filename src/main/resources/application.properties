# ── Identificación de la aplicación ─────────────────────────────
spring.application.name=vivaeventos-auth
app.version=0.0.1
app.api.version=v1

# ── Servidor HTTP ────────────────────────────────────────────────
server.port=8083

# ── Base de datos (PostgreSQL) ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/vivaeventos_auth
spring.datasource.username=devdb
spring.datasource.password=a1b2c3d4
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Pool de conexiones (HikariCP) ───────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ── JWT ─────────────────────────────────────────────────────
jwt.secret=dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
jwt.expiration=86400000

# ── Actuator ────────────────────────────────────────────────
management.server.port=8082
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*

# ── Logging ─────────────────────────────────────────────────────
logging.level.root=ERROR
logging.level.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ── JSON formateado ───────────────────────────────────────────────────
spring.jackson.serialization.indent-output=true