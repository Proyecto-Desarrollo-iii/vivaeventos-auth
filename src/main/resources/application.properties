# ── Identificación de la aplicación ─────────────────────────────
spring.application.name=vivaeventos-auth
app.version=0.0.1
app.api.version=v1

# ── Servidor HTTP ────────────────────────────────────────────────
server.port=8083

# ── Base de datos (PostgreSQL) ───────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/vivaeventos_auth
spring.datasource.username=${DB_USERNAME:devdb}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Pool de conexiones (HikariCP) ───────────────────────────────
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ── JWT ─────────────────────────────────────────────────────
# Generar una clave de 256 bits: openssl rand -base64 32
# Debe configurarse via variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Actuator ────────────────────────────────────────────────
management.server.port=8082
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ── Logging ─────────────────────────────────────────────────────
logging.level.root=ERROR
logging.level.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ── Servicios externos ──────────────────────────────────────────
services.audit.url=${SERVICES_AUDIT_URL:http://audit:8089}

# ── JSON formateado ───────────────────────────────────────────────────
spring.jackson.serialization.indent-output=true